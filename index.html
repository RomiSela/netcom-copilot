/* ---------------- CRM LOG STORE ----------------
   Logged interactions persist in the artifact's shared `db` (collection "interactions"),
   so agents, team leads and the manager all see them. Where db is unavailable
   (local preview, a saved copy) it falls back to this browser's storage. */
const LogCtx=createContext({logs:[],add:async()=>{},mode:'local'});
const LOCAL_KEY='netcom-logs';
const normLog=d=>({...d,cust:d.cust??d.customer_id,agent:d.agent??d.agent_id});
function readLocalLogs(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]').map(normLog)}catch(e){return []}}
function useLogStore(){
  const [logs,setLogs]=useState(readLocalLogs);
  const [mode,setMode]=useState('local');
  const dbRef=useRef(null);
  useEffect(()=>{
    let alive=true, unsub=null;
    (async()=>{
      const db=window.claude&&window.claude.use?await window.claude.use('db'):null;
      if(!alive||!db) return;
      dbRef.current=db; setMode('db');
      unsub=db.collection('interactions').orderBy('created','desc').limit(1000)
        .onSnapshot(s=>setLogs(s.docs.map(d=>normLog({id:d.id,...d.data()}))), ()=>{dbRef.current=null;setMode('local');setLogs(readLocalLogs())});
    })();
    return()=>{alive=false;unsub&&unsub()};
  },[]);
  const add=async rec=>{
    const r={...rec,created:Date.now()};
    if(dbRef.current){await dbRef.current.collection('interactions').add(r);return}
    setLogs(l=>{const n=[normLog({id:'local-'+r.created,...r}),...l];try{localStorage.setItem(LOCAL_KEY,JSON.stringify(n.slice(0,500)))}catch(e){}return n});
  };
  return {logs,add,mode};
}

/* ---------------- API LAYER ----------------
   The UI reaches Netcom's systems only through `api` (useApi()), never through the data files.
   Contracts follow integration_spec.md. MODE "mock" answers from the assignment files with
   network latency and the spec's error codes (401 token expired, 404 not found, 503 unavailable);
   a real transport implements the same methods with fetch() and nothing in the UI changes. */
const API_MODE='mock';
class ApiError extends Error{constructor(status,code,message){super(message||code);this.status=status;this.code=code}}
const ApiCtx=createContext(null);
const useApi=()=>useContext(ApiCtx);
const REASON_CODES_API=['BILLING','TECH_OUTAGE','TECH_DEVICE','SALES','CANCEL','OTHER'];
const SCENARIO_QUEUE={dc:'billing',bill:'billing',cancel:'retention',tech:'technical'};
function createApi({persist}){
  const listeners=new Set(); const log=[]; const flags={fail503:false,expired401:false};
  let nextCallId=Number(NEW_CALL_ID);
  const wait=(a,b)=>new Promise(r=>setTimeout(r,a+Math.random()*(b-a)));
  const copy=o=>JSON.parse(JSON.stringify(o));
  const emit=()=>{const snap=log.slice();listeners.forEach(l=>l(snap))};
  // every request passes here: latency, simulated failures, and an entry in the API log
  async function request(system,method,path,handler,{latency=[180,520],canFail=true,simulate}={}){
    const t0=performance.now(); let status=200;
    try{
      await wait(latency[0],latency[1]);
      if(canFail&&flags.expired401) throw new ApiError(401,'token_expired','Token expired');
      if(canFail&&(flags.fail503||simulate===503)) throw new ApiError(503,'unavailable',system+' unavailable');
      const out=await handler();
      if(out&&out.__status){status=out.__status;return out.body}
      return out;
    }catch(e){if(!(e instanceof ApiError))e=new ApiError(500,'internal',String(e&&e.message||e));e.system=system;status=e.status;throw e}
    finally{log.unshift({id:Date.now()+Math.random(),at:new Date(),system,method,path,status,ms:Math.round(performance.now()-t0)});if(log.length>80)log.pop();emit()}
  }
  const crm={
    /** GET /customers/{customer_id} → plan, price, open tickets, recent interactions */
    getCustomer:id=>request('CRM','GET',`/customers/${id}`,()=>{
      const c=CRM[id]; if(!c) throw new ApiError(404,'customer_not_found','Customer not found'); return copy(c)}),
    /** POST /customers/{customer_id}/interactions — body exactly as the spec:
        {call_id, agent_id, reason_code, resolved, summary, follow_up?}. `context` = fields our backend adds. */
    postInteraction:(id,body,context={},opts={})=>request('CRM','POST',`/customers/${id}/interactions`,async()=>{
      if(!id||!(CRM[id]||CUST_CALLS[id])) throw new ApiError(404,'customer_not_found','Customer not found');
      const missing=['call_id','agent_id','reason_code','summary'].filter(k=>!body[k]);
      if(missing.length) throw new ApiError(400,'invalid_body','missing '+missing.join(', '));
      if(!REASON_CODES_API.includes(body.reason_code)) throw new ApiError(400,'invalid_body','reason_code');
      if(body.summary.length>1000) throw new ApiError(400,'invalid_body','summary > 1000 chars');
      await persist({customer_id:id,...body,created_at:new Date().toISOString(),...context});
      return {__status:201,body:{status:'created',customer_id:id,call_id:body.call_id}};
    },{latency:[400,900],simulate:opts.simulate}),
  };
  const stt={
    /** GET /jobs/{job_id} → status + diarized transcript */
    getJob:jobId=>request('STT','GET',`/jobs/${jobId}`,()=>{
      const j=D.transcripts.find(x=>x.job_id===jobId); if(!j) throw new ApiError(404,'job_not_found','No transcript'); return copy(j)}),
    /** our backend's index: the job whose `reference` is this call_id */
    getTranscriptForCall:callId=>request('STT','GET',`/jobs?reference=${callId}`,()=>{
      const j=JOBS[callId]; if(!j) throw new ApiError(404,'job_not_found','No transcript'); return copy(j)}),
  };
  const ai={
    /** AI engine: transcript + service policy → summary, reason_code, breaches, next best actions.
        Mock: the pre-computed analysis of the 6 sample calls. */
    analyzeCall:callId=>request('AI','POST',`/analyze?call_id=${callId}`,()=>{
      const a=AI[callId]; if(!a) throw new ApiError(404,'no_analysis','No analysis'); return a},{latency:[300,700]}),
  };
  const pbx={
    /** answer the next ringing call (mock: a scripted caller for the chosen demo scenario) */
    answerNextCall:({agentId,scenario})=>request('PBX','POST','/calls/answer',()=>({
      event:'call.answered',call_id:String(++nextCallId),parent_call_id:null,agent_id:agentId,customer_id:CALLER[scenario],
      queue:SCENARIO_QUEUE[scenario],scenario,started_at:new Date().toISOString()}),{latency:[300,600],canFail:false}),
    /** the `call.ended` webhook the phone system sends when the call ends */
    hangup:c=>request('PBX','POST',`/calls/${c.call_id}/hangup`,()=>({
      event:'call.ended',call_id:c.call_id,parent_call_id:c.parent_call_id,agent_id:c.agent_id,customer_id:c.customer_id,queue:c.queue,
      started_at:c.started_at,ended_at:new Date().toISOString(),recording_url:`https://pbx.netcom.example/recordings/${c.call_id}.wav`}),{latency:[100,250],canFail:false}),
  };
  return {mode:API_MODE,crm,stt,ai,pbx,
    mock:{flags,set:p=>{Object.assign(flags,p);emit()}},
    onLog:fn=>{listeners.add(fn);fn(log.slice());return()=>listeners.delete(fn)}};
}
/* load once per dependency change; exposes {loading, data, error, retry} */
function useApiQuery(fn,deps){
  const [st,setSt]=useState({loading:true}); const [n,setN]=useState(0);
  useEffect(()=>{let alive=true;setSt({loading:true});
    fn().then(d=>{if(alive)setSt({data:d})},e=>{if(alive)setSt({error:e})});
    return()=>{alive=false}},[...deps,n]);
  return {...st,retry:()=>setN(x=>x+1)};
}
function parseCustomerId(raw){
  const v=String(raw||'').trim().toUpperCase().replace(/[\s-]/g,'');
  if(/^C\d{5}$/.test(v)) return {kind:'cid',id:v};
  if(/^\d{5,9}$/.test(v)) return {kind:'nid',id:v};
  return null;
}
/* search = CRM lookup through the API + the customer's calls from the call log */
async function findCustomer(api,raw){
  const p=parseCustomerId(raw); if(!p) return null;
  let crm=null;
  try{crm=await api.crm.getCustomer(p.id)}catch(e){if(e.status!==404) throw e}
  const calls=(CUST_CALLS[p.id]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
  return {...p,crm,calls,tx:calls.filter(r=>JOBS[r.id])};
}
const apiErrText=(t,e)=>{
  if(!e||!e.status) return t('errGeneric'); const s=e.system||'API';
  if(e.status===401) return t('err401',s); if(e.status===503) return t('err503',s);
  if(e.status===404) return e.code==='customer_not_found'?t('err404cust'):e.code==='job_not_found'?t('err404tx'):t('err404');
  if(e.status===400) return t('err400',e.message); return t('errGeneric');
};
const Loading=({text})=><div className="flex items-center gap-2 text-sm text-muted py-2"><Ic n="LoaderCircle" size={15} className="animate-spin"/>{text}</div>;
function ApiErrorBox({error,onRetry}){
  const {t}=useT();
  return <div role="alert" className="rounded-lg bg-badsoft px-3 py-2.5 text-sm text-bad flex flex-wrap items-center gap-2">
    <Ic n="TriangleAlert" size={15}/><span className="flex-1 min-w-0">{apiErrText(t,error)}</span>
    {onRetry&&<button onClick={onRetry} className="rounded-md border border-line bg-card px-2.5 py-1 text-xs font-semibold text-ink hover:bg-sunken">{t('retry')}</button>}
  </div>;
}

function resolveUser(raw){
  const v=String(raw||'').trim().toUpperCase();
  if(v==='1') return {id:'A17',role:'agent',name:AGENT_NAMES.A17,team:AGENT_TEAM.A17};
  if(v==='2'||v==='M01') return MANAGER;

  return {id,role:'agent',name:AGENT_NAMES[id]||{en:id,he:id},f:AGENT_NAMES[id]?.f,team:AGENT_TEAM[id]};

/* QA flags: transcript-verified for the 6 transcribed calls, metadata rules for the rest */
const TX_FLAGS = {
 '203743':[['violation','Promised 24h bank refund']],
 '204773':[['violation','Account discussed before ID check'],['warning','Customer misinformed on prior call']],
 '206013':[['violation','Transferred without line check'],['violation','No remote reset before technician'],['violation','WFH priority slot not offered']],
 '206654':[['violation','No retention offer before cancel']],
 '206708':[],'206953':[],
};
function flagsFor(r){
  if(TX_FLAGS[r.id]) return {src:'transcript',f:TX_FLAGS[r.id]};
  const f=[];
  if(r.cancel===1 && r.offer===0) f.push(['violation','No retention offer before cancel']);
  if(r.topic==='double charge' && r.rep===1) f.push(['warning','Repeat in 7d: possible 24h-refund promise']);
  if(r.queue==='technical' && r.tr===1 && TECH_TOPICS.includes(r.topic)) f.push(['warning','Transferred: line check not confirmed']);
  if(r.hold>=240) f.push(['warning','Hold over 4 min']);
  return {src:'metadata',f};
}

function useTicker(job,autoplay){
  const [time,setTime]=useState(job.duration_sec);
  const [playing,setPlaying]=useState(false);
  const [speed,setSpeed]=useState(4);
  useEffect(()=>{setTime(job.duration_sec);setPlaying(false)},[job.reference]);
  useEffect(()=>{if(autoplay){setTime(0);setPlaying(true)}},[autoplay]); // a customer search replays the call live
  useEffect(()=>{
    if(!playing) return;
    const id=setInterval(()=>{
      setTime(prev=>{
        const seg=job.segments.find(s=>s.start<=prev&&prev<s.end);
        const mult=seg&&seg.speaker===null?40:1; // fast-forward hold music
        const nt=prev+0.1*speed*mult;
        if(nt>=job.duration_sec){setPlaying(false);return job.duration_sec}
        return nt;
      });
    },100);
    return()=>clearInterval(id);
  },[playing,speed,job.reference]);
  return {time,setTime,playing,setPlaying,speed,setSpeed};
}

function Transcript({job,ai,time,events,alertMode='full',onAction,actionDone}){
  const {t,he}=useT();
  const ref=useRef(null);
  const shown=job.segments.filter(s=>s.start<=time);
  const evs=events.filter(e=>e.at<=time);
  // interleave: each alert appears right after the segment in which it fired
  const items=[...shown.map((s,i)=>({k:s.start,o:0,s,i})),...evs.map(e=>({k:e.at,o:1,e}))].sort((a,b)=>a.k-b.k||a.o-b.o);
  const spk=pick(he,ai,'speakers');
  useEffect(()=>{const el=ref.current;if(el&&time<job.duration_sec) el.scrollTop=el.scrollHeight},[shown.length,evs.length]);
  const sevAt=s=>{const ev=events.filter(e=>e.at>s.start&&e.at<=s.end&&(e.sev==='violation'||e.sev==='warning'));return ev[0]?.sev};
  // fit the box to the window: it ends at the bottom of the screen, so the page and the transcript never both scroll
  const [boxH,setBoxH]=useState(560);
  useLayoutEffect(()=>{const fit=()=>{const el=ref.current;if(!el)return;const top=el.getBoundingClientRect().top+window.scrollY;setBoxH(Math.max(360,Math.round(window.innerHeight-top-20)))};
    fit();const id=setTimeout(fit,300);window.addEventListener('resize',fit);return()=>{clearTimeout(id);window.removeEventListener('resize',fit)}},[]);
  return <div ref={ref} style={{height:boxH}} className="overflow-y-auto scroll-thin px-4 py-3 space-y-2.5">
    {items.map(it=>{
      if(it.e){const k='e'+it.e.at+it.e.title;
        if(alertMode==='hidden') return null;
        return alertMode==='compact'?<div key={k} className="flex justify-center"><AlertChip e={it.e}/></div>:<div key={k} className="mx-auto max-w-[92%]"><AlertCard e={it.e} inline onAction={onAction} actionDone={actionDone}/></div>;}
      const s=it.s, i=it.i;
      if(s.speaker===null) return <div key={i} className="flex items-center gap-3 py-1.5 text-xs text-faint"><span className="h-px flex-1 bg-line"/><Ic n="Pause" size={13}/><span className="tnum">{t('holdSeg')} · <LtrNum>{fmtT(s.end-s.start)}</LtrNum></span><span className="he">{s.text}</span><span className="h-px flex-1 bg-line"/></div>;
      const cust=s.speaker==='SPEAKER_01'; const sv=sevAt(s);
      const live=time<s.end;
      return <div key={i} className={`rise flex ${cust?'justify-end':'justify-start'}`}>
        <div className={`max-w-[80%] rounded-xl px-3 py-2 border ${cust?'bg-sunken border-transparent':'bg-card border-line'}`} style={sv?{borderColor:SEV[sv].bd,borderWidth:1.5}:{}}>
          <div className="flex items-center gap-2 text-[11px] text-faint mb-0.5">
            <span className={`font-semibold ${cust?'text-muted':'text-accent'}`}>{spk[s.speaker]||s.speaker}</span>
            <LtrNum className="tnum">{fmtT(s.start)}</LtrNum>
            {sv&&<span className={SEV[sv].c}><Ic n={SEV[sv].icon} size={12}/></span>}
          </div>
          <p dir="rtl" className="he text-[15px] leading-relaxed text-ink">{s.text}{live&&<span className="caret text-accent">▍</span>}</p>
        </div></div>;
    })}
  </div>;
}

function procState(callId,time,done){
  const cp=CALL_PROC[callId]; const out={};
  Object.entries(cp.st).forEach(([k,[at,v]])=>{if(at<=time) out[k]=v});
  if(done) Object.entries(cp.end||{}).forEach(([k,v])=>{out[k]=v});

}

function contextAlerts(res){
  const c=res.calls, a=[{sev:'info',k:'ctxId'}];
  if(c.length) a.push({sev:'warning',k:'ctxRepeat',arg:c.length});
  if(c.some(r=>r.topic==='double charge'||r.topic==='refund status')) a.push({sev:'nba',k:'ctxBill'});
  if(c.some(r=>r.cancel)) a.push({sev:'warning',k:'ctxCancel'});
  if(c.some(r=>r.queue==='technical'&&r.tr)) a.push({sev:'nba',k:'ctxTech'});
  if((res.crm?.flags||[]).includes('works_from_home')) a.push({sev:'nba',k:'ctxWfh'});
  if(res.crm?.plan.includes('promotion ended')) a.push({sev:'nba',k:'ctxPromo'});
  return a;
}

    {s:'a',tx:'אפשר לחדש את ההטבה פעם אחת לפי מחירון החידוש הנוכחי, וזה יוריד את החשבון לשנה הקרובה.',sum:'הוצע חידוש חד-פעמי של ההטבה לפי מחירון החידוש.',
     ev:[EV('pass','Promotion renewal offered per policy','הוצע חידוש הטבה לפי הנוהל','One-time renewal, current price list.','חידוש חד-פעמי, לפי המחירון הנוכחי.')]},
    {s:'c',tx:`כן, ${A('תחדש','תחדשי')} בבקשה.`},
    {s:'a',tx:`חידשתי. ההטבה תופיע בחשבונית הבאה, ואני ${A('שולח','שולחת')} לך סיכום במייל.`,sum:'ההטבה חודשה ותופיע בחשבונית הבאה; נשלח סיכום במייל.'},
    {s:'c',tx:'תודה רבה!'},
   ]},
  };
  return S[key];
}
function buildSim(key,x,run){
  const sc=scenario(key,x); const segs=[],events=[],sums=[]; let tm=0.5;
  sc.lines.forEach(l=>{
    const d=l.s==='h'?l.d:Math.max(2.5,l.tx.length/13+1);
    const seg={start:tm,end:tm+d,speaker:l.s==='h'?null:l.s==='a'?'SPEAKER_00':'SPEAKER_01',text:l.tx};
    segs.push(seg);
    (l.ev||[]).forEach((e,i)=>events.push({...e,at:+(seg.end+0.3+i*0.01).toFixed(2)}));
    if(l.sum) sums.push({at:seg.end,tx:l.sum});
    tm=seg.end+0.9;
  });
  const dur=+tm.toFixed(2);
  return {dur,events,reason:sc.reason,resolved:sc.resolved,follow:sc.follow,
    job:{reference:`live-${key}-${run}`,job_id:'live',duration_sec:dur,segments:segs},
    ai:{speakers:{SPEAKER_00:`Agent · ${x.nameEn} (${x.aid})`,SPEAKER_01:'Customer'},speakersHe:{SPEAKER_00:`${x.af?'נציגה':'נציג'} · ${x.name} (${x.aid})`,SPEAKER_01:x.cf?'לקוחה':'לקוח'}},
    summary:time=>{const full=time>=dur-0.01;const parts=sums.filter(s=>s.at<=time).map(s=>s.tx);return ((full?'':'השיחה הסתיימה לפני סיום הטיפול. ')+parts.join(' ')).trim()}};
}

/* KPI tile with its weekly trend: a small line (dashed where the week is still incomplete) and the change since the first week */

  const dTone=neutral||flat?'text-muted':((d>0)===goodUp?'text-good':'text-bad');

        <Tooltip {...TT} cursor={{stroke:'var(--line)'}} formatter={v=>[fmt(v),label]}/>
        <Line dataKey="line" stroke="var(--t1)" strokeWidth={1.5} strokeDasharray="3 3" dot={false} isAnimationActive={false} tooltipType="none" connectNulls/>
        <Line dataKey="solid" stroke="var(--t1)" strokeWidth={2.25} dot={{r:2,fill:'var(--t1)',strokeWidth:0}} activeDot={{r:4}} isAnimationActive={false}/>
      </LineChart></ResponsiveContainer></Chart>

    </div>}
  </div>;

    <div className="rounded-lg bg-sunken p-2.5"><div className="text-[11px] text-muted font-semibold">{lb}</div><div className="text-xl font-semibold tnum">{fmt(b)}</div></div></div>;
}
const Seg=({opts,val,set})=><div className="inline-flex flex-wrap rounded-md border border-line p-0.5 bg-sunken">{opts.map(([k,l])=><button key={k} onClick={()=>set(k)} className={`px-2 py-0.5 text-[11px] font-semibold rounded ${val===k?'bg-card text-ink shadow-sm':'text-muted'}`}>{l}</button>)}</div>;

const Why=({children})=><p className="text-[13px] text-muted leading-snug mb-3">{children}</p>;

const Section=({n,title,sub,children})=><section className="space-y-3">

function TopicBars({data,max,hi,fmt,label}){
  return <Chart h={200}><ResponsiveContainer><BarChart data={data} layout="vertical" margin={{left:4,right:40,top:4,bottom:0}}>
    <CartesianGrid horizontal={false} stroke="var(--grid)"/>
    <XAxis type="number" domain={[0,max]} tickLine={false} axisLine={false} tickFormatter={v=>v+'%'}/>
    <YAxis type="category" dataKey="t" width={130} tickLine={false} axisLine={false} interval={0}/>
    <Tooltip {...TT} formatter={v=>[fmt(v),label]}/>
    <Bar dataKey="v" radius={[0,4,4,0]} barSize={13}>{data.map(d=><Cell key={d.key} fill={hi(d.key)?'var(--bad)':'var(--base)'}/>)}<LabelList dataKey="v" position="right" style={{fill:'var(--muted)',fontSize:11}} formatter={fmt}/></Bar>
  </BarChart></ResponsiveContainer></Chart>;
}

function Retention({rows}){
  const {t}=useT();
  const s=stats(rows);
  const data=[{k:t('offerMade'),saved:+f1(s.offSaved),churn:+f1(100-s.offSaved)},{k:t('noOffer'),saved:+f1(s.noSaved),churn:+f1(100-s.noSaved)}];
  const extra=Math.round(s.no*(s.offSaved-s.noSaved)/100);
  const by={}; rows.filter(r=>r.cancel===1).forEach(r=>{(by[r.agent]=by[r.agent]||{a:r.agent,n:0,o:0});by[r.agent].n++;if(r.offer===1)by[r.agent].o++});
  const lowL=Object.values(by).filter(x=>x.n>=10).sort((a,b)=>a.o/a.n-b.o/b.n).slice(0,3).map(x=>`${x.a} (${Math.round(pct(x.o,x.n))}%)`).join(', ');
  const low=lowL?'⁦'+lowL+'⁩':''; // LTR isolate keeps the list order in Hebrew
  const ratio=s.noSaved>0?s.offSaved/s.noSaved:0;
  return <Card title={t('retTitle')} icon="UserMinus">
    <Why>{t('retWhy2',fmtN(s.no),fmtN(s.cancel),f1(s.offSaved),f1(s.noSaved))}</Why>
    <div className="grid grid-cols-2 gap-2">
      <div className="rounded-lg bg-badsoft p-2.5"><div className="text-xl font-semibold tnum text-bad">{fmtN(s.no)}</div><div className="text-[12px] text-bad">{t('noOfferCalls',fmtN(s.cancel))}</div></div>
      <div className="rounded-lg bg-goodsoft p-2.5"><div className="text-xl font-semibold tnum text-good">~{fmtN(extra)}</div><div className="text-[12px] text-good">{t('recoverable')}</div></div>
    </div>
    <div className="lbl mt-3">{t('savedBy')}</div>
    <div className="mt-1"><Chart h={120}><ResponsiveContainer><BarChart data={data} layout="vertical" stackOffset="expand" margin={{left:4,right:12,top:4,bottom:0}}>
      <XAxis type="number" tickFormatter={v=>Math.round(v*100)+'%'} tickLine={false} axisLine={false}/>
      <YAxis type="category" dataKey="k" width={84} tickLine={false} axisLine={false}/>
      <Tooltip {...TT} formatter={(v,n)=>[v+'%',n==='saved'?t('saved'):t('churned')]}/>
      <Bar dataKey="saved" stackId="a" fill="var(--good)" barSize={24} stroke="var(--card)" strokeWidth={2}><LabelList dataKey="saved" position="insideLeft" style={{fill:'#fff',fontSize:12,fontWeight:600}} formatter={v=>v+t('pctSaved')}/></Bar>
      <Bar dataKey="churn" stackId="a" fill="var(--bad)" radius={[0,4,4,0]} stroke="var(--card)" strokeWidth={2}><LabelList dataKey="churn" position="insideRight" style={{fill:'#fff',fontSize:12,fontWeight:600}} formatter={v=>v+t('pctChurned')}/></Bar>
    </BarChart></ResponsiveContainer></Chart></div>
    <p className="text-xs text-faint mt-1">{t('retNote',f1(s.offSaved),f1(s.noSaved))}</p>
    <Action>{t('retDo',low)}</Action>
  </Card>;
}

function DoubleCharge({rows}){
  const {t,topic}=useT();
  const dc=stats(rows.filter(r=>r.topic==='double charge')), ot=stats(rows.filter(r=>r.topic!=='double charge'));
  const data=D.topics.map(x=>{const s=stats(rows.filter(r=>r.topic===x));return {key:x,t:topic(x),v:+f1(s.rep),n:s.n}}).filter(d=>d.n).sort((a,b)=>b.v-a.v).slice(0,6);
  return <Card title={t('dcTitle')} icon="Receipt">
    <Why>{t('dcWhy2',fmtN(dc.n),f1(dc.rep),f1(ot.rep))}</Why>
    <div className="lbl mb-1">{t('repeat7Label')}</div>
    <Compare a={dc.rep} b={ot.rep} la={t('dcLabel',fmtN(dc.n))} lb={t('otherTopics')} fmt={v=>f1(v)+'%'}/>
    <div className="lbl mt-3">{t('repByTopic')}</div>
    <div className="mt-1"><TopicBars data={data} max={30} hi={k=>k==='double charge'} fmt={v=>v+'%'} label={t('repeat7')}/></div>
    <Action>{t('dcDo2',fmtN(Math.max(0,Math.round(dc.n*(dc.rep-ot.rep)/100))))}</Action>

}

function PingPong({rows}){
  const {t,topic}=useT();
  const tech=rows.filter(r=>r.queue==='technical');
  const tT=stats(tech.filter(r=>r.tr)), tN=stats(tech.filter(r=>!r.tr));
  const trd=D.topics.map(x=>{const s=stats(rows.filter(r=>r.topic===x));return {key:x,t:topic(x),v:+f1(s.tr),n:s.n}}).filter(d=>d.n).sort((a,b)=>b.v-a.v).slice(0,6);
  return <Card title={t('ppTitle')} icon="ArrowLeftRight">
    <Why>{t('ppWhy2',f1(stats(tech).tr),f1(tT.rep),f1(tN.rep))}</Why>
    <div className="lbl mb-1">{t('repeat7Label')}</div>
    <Compare a={tT.rep} b={tN.rep} la={t('trTech',fmtN(tT.n))} lb={t('notTr')} fmt={v=>f1(v)+'%'}/>
    <div className="text-xs text-muted mt-1.5">{t('csatShort')}: <b className="text-bad tnum">{tT.csat.toFixed(2)}</b> {t('vs')} <b className="tnum">{tN.csat.toFixed(2)}</b></div>
    <div className="lbl mt-3">{t('trByTopic')}</div>
    <div className="mt-1"><TopicBars data={trd} max={40} hi={k=>TECH_TOPICS.includes(k)} fmt={v=>v+'%'} label={t('transferred')}/></div>
    <Action>{t('ppDo2',fmtN(Math.max(0,Math.round(tT.n*(tT.rep-tN.rep)/100))))}</Action>
  </Card>;
}

const FLAG_TYPES=['No retention offer before cancel','Repeat in 7d: possible 24h-refund promise','Transferred: line check not confirmed','Hold over 4 min'];

  const {t,queue,topic,flag}=useT();
  const [st,setSt]=useState('all'); const [q,setQ]=useState(''); const [ft,setFt]=useState('all'); const [page,setPage]=useState(0);
  const list=useMemo(()=>{
    let l=rows.filter(r=>(st==='all'||r.status===st)&&(ft==='all'||r.flags.some(f=>f[1]===ft))&&(!q||r.agent.toLowerCase()===q.toLowerCase()||r.id.includes(q)||r.cust.toLowerCase().includes(q.toLowerCase())));
    return l.sort((a,b)=>(b.flagSrc==='transcript')-(a.flagSrc==='transcript')||b.id-a.id);

  useEffect(()=>setPage(0),[rows,st,q,ft]);

      <select id="flagtype" aria-label={t('allFlags')} value={ft} onChange={e=>setFt(e.target.value)} className="rounded-md border border-line px-2 py-1 text-xs max-w-full"><option value="all">{t('allFlags')}</option>{FLAG_TYPES.map(f=><option key={f} value={f}>{flag(f)}</option>)}</select>
      <div className="relative"><span className="absolute start-2 top-1.5 text-faint"><Ic n="Search" size={13}/></span><input id="qa-search" value={q} onChange={e=>setQ(e.target.value)} placeholder={t('searchPh')} className="rounded-md border border-line bg-card ps-7 pe-2 py-1 text-xs w-60 max-w-full"/></div>
    </div>
    <div className="overflow-x-auto scroll-thin">
      <table className="w-full text-sm min-w-[860px]">

        <tbody>{view.map(r=><tr key={r.id} className="border-b border-line hover:bg-sunken">
          <td className="px-3 py-2 mono tnum">{r.id}</td>

          <td className="px-3 py-2"><span className="mono">{r.agent}</span> <span className="text-xs text-faint">· {r.team}</span></td>
          <td className="px-3 py-2 text-muted">{queue(r.queue)}</td>
          <td className="px-3 py-2">{topic(r.topic)}</td>
          <td className="px-3 py-2">{r.status==='violation'?<Badge tone="violation">{t('stViolation')}</Badge>:r.status==='warning'?<Badge tone="warning">{t('stReview')}</Badge>:<Badge tone="pass">{t('stPassed')}</Badge>}</td>
          <td className="px-3 py-2"><div className="flex flex-col gap-0.5">{r.flags.length?r.flags.map((f,i)=><span key={i} className={`text-xs ${f[0]==='violation'?'text-bad':'text-warn'}`}>• {flag(f[1])}</span>):<span className="text-xs text-faint">—</span>}

/* ---------------- PERIOD FILTER & TREND ---------------- */
const DATA_START='2026-09-01', DATA_END='2026-09-30';
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dm=iso=>`${+iso.slice(8,10)}.${+iso.slice(5,7)}`;
const rowDay=r=>'2026-'+r.time.slice(0,5);
const PERIODS=['7','14','30','90','180','custom'];
function periodRange(per,cf,ct){
  if(per==='custom'){const a=cf<=ct?cf:ct,b=cf<=ct?ct:cf;return {from:a<DATA_START?DATA_START:a,to:b>DATA_END?DATA_END:b,clipped:a<DATA_START,want:a}}
  const f=addDays(DATA_END,-(+per-1));
  return {from:f<DATA_START?DATA_START:f,to:DATA_END,clipped:f<DATA_START,want:f};
}

function PeriodFilter({per,setPer,cf,setCf,ct,setCt,range,n}){
  const {t}=useT();
  return <div className="space-y-1.5">
    <div className="flex flex-wrap items-center gap-2">
      <span className="lbl">{t('period')}</span>
      <div className="inline-flex flex-wrap rounded-lg border border-line p-0.5 bg-sunken" role="radiogroup" aria-label={t('period')}>
        {PERIODS.map(k=><button key={k} role="radio" aria-checked={per===k} onClick={()=>setPer(k)} className={`px-2.5 py-1 text-xs font-semibold rounded-md ${per===k?'bg-card text-ink shadow-sm':'text-muted hover:text-ink'}`}>{t('p'+k)}</button>)}
      </div>
      {per==='custom'&&<div className="flex flex-wrap items-center gap-2 text-xs">
        <label htmlFor="from" className="text-muted">{t('from')}</label><input id="from" type="date" dir="ltr" value={cf} min={DATA_START} max={DATA_END} onChange={e=>e.target.value&&setCf(e.target.value)} className="rounded-md border border-line bg-card px-2 py-1"/>
        <label htmlFor="to" className="text-muted">{t('to')}</label><input id="to" type="date" dir="ltr" value={ct} min={DATA_START} max={DATA_END} onChange={e=>e.target.value&&setCt(e.target.value)} className="rounded-md border border-line bg-card px-2 py-1"/>
      </div>}
      <span className="text-xs text-muted">{t('rangeTxt',dm(range.from),dm(range.to),fmtN(n))}</span>
    </div>
    {range.clipped&&<div className="flex items-center gap-1.5 text-xs text-warn"><Ic n="CalendarX" size={13}/>{t('clipNote',dm(range.want))}</div>}
  </div>;
}

function Trend({rows,range}){
  const {t}=useT();
  const [m,setM]=useState('count'); const [g,setG]=useState('day');
  const data=useMemo(()=>{
    const map=new Map();
    rows.forEach(r=>{const d=rowDay(r); const k=g==='week'?addDays(d,-new Date(d+'T00:00:00Z').getUTCDay()):d;
      const b=map.get(k)||{k,n:0,res:0,fcr:0}; b.n++; if(r.res)b.res++; if(r.res&&!r.rep)b.fcr++; map.set(k,b)});
    return [...map.values()].sort((a,b)=>a.k.localeCompare(b.k)).map(b=>{
      let label=dm(b.k), partial=false;
      if(g==='week'){const e0=addDays(b.k,6); const s=b.k<range.from?range.from:b.k, e=e0>range.to?range.to:e0; partial=s!==b.k||e!==e0; label=`${dm(s)}–${dm(e)}${partial?'*':''}`}
      return {label,partial,n:b.n,res:b.res,un:b.n-b.res,rate:b.n>=20?+f1(pct(b.res,b.n)):null,fcrRate:b.n>=20?+f1(pct(b.fcr,b.n)):null};
    });
  },[rows,g,range.from,range.to]);
  // first vs last 7 days of the selected range
  const span=(new Date(range.to)-new Date(range.from))/864e5+1;
  let cmp=null;
  if(span>=14){
    const win=(a,b)=>rows.filter(r=>{const d=rowDay(r);return d>=a&&d<=b});
    const A=win(range.from,addDays(range.from,6)), B=win(addDays(range.to,-6),range.to);
    const days=x=>new Set(x.map(rowDay)).size||1;
    cmp={ra:pct(A.filter(r=>r.res).length,A.length),rb:pct(B.filter(r=>r.res).length,B.length),va:A.length/days(A),vb:B.length/days(B)};
  }
  const Delta=({d,unit,good})=>{const tone=Math.abs(d)<1?'text-muted':(d>0)===good?'text-good':'text-bad';return <span className={`font-semibold ${tone}`}><LtrNum>{d>0?'+':''}{f1(d)}{unit}</LtrNum></span>};
  const vals=data.flatMap(d=>[d.rate,d.fcrRate]).filter(v=>v!=null);
  const lo=vals.length?Math.max(0,Math.floor(Math.min(...vals)/5)*5-5):0, hi=vals.length?Math.min(100,Math.ceil(Math.max(...vals)/5)*5+5):100;
  const pctTicks=[]; for(let v=lo;v<=hi;v+=5) pctTicks.push(v);
  return <Card title={t('trendTitle')} icon="TrendingDown" right={<div className="flex flex-wrap gap-2"><Seg opts={[['count',t('tCount')],['rate',t('tRate')]]} val={m} set={setM}/><Seg opts={[['day',t('tDay')],['week',t('tWeek')]]} val={g} set={setG}/></div>}>
    {cmp&&<div className="grid gap-2 sm:grid-cols-2 mb-3">
      <div className="rounded-lg bg-sunken px-3 py-2 text-sm"><div className="lbl mb-0.5">{t('cmpRate')}</div>
        <LtrNum className="tnum">{f1(cmp.ra)}%</LtrNum><Ic n="ArrowRight" size={13} className="inline mx-1 text-faint rtl:-scale-x-100"/><LtrNum className="tnum">{f1(cmp.rb)}%</LtrNum> <Delta d={cmp.rb-cmp.ra} unit={t('pts')} good={true}/></div>
      <div className="rounded-lg bg-sunken px-3 py-2 text-sm"><div className="lbl mb-0.5">{t('cmpVol')}</div>
        <LtrNum className="tnum">{Math.round(cmp.va)}</LtrNum><Ic n="ArrowRight" size={13} className="inline mx-1 text-faint rtl:-scale-x-100"/><LtrNum className="tnum">{Math.round(cmp.vb)}</LtrNum> <Delta d={pct(cmp.vb-cmp.va,cmp.va)} unit="%" good={false}/></div>
    </div>}
    <div className="flex flex-wrap gap-4 text-xs text-muted mb-1">
      {m==='count'?<><Swatch c="var(--t1)">{t('resolvedL')}</Swatch><Swatch c="var(--t2)">{t('unresolvedL')}</Swatch></>
        :<><Swatch c="var(--t1)">{t('resolvedL')} %</Swatch><Swatch c="var(--t3)">{t('fcrL')} %</Swatch></>}
    </div>
    <Chart h={280}><ResponsiveContainer>
      {m==='count'?
      <BarChart data={data} margin={{left:0,right:8,top:8,bottom:0}}>
        <CartesianGrid vertical={false} stroke="var(--grid)"/>
        <XAxis dataKey="label" tickLine={false} axisLine={false} interval="preserveStartEnd" minTickGap={8}/>
        <YAxis tickLine={false} axisLine={false} width={40}/>
        <Tooltip {...TT} formatter={(v,name)=>[fmtN(v),name]}/>
        <Bar dataKey="res" name={t('resolvedL')} stackId="a" fill="var(--t1)" stroke="var(--card)" strokeWidth={1} maxBarSize={36}/>
        <Bar dataKey="un" name={t('unresolvedL')} stackId="a" fill="var(--t2)" stroke="var(--card)" strokeWidth={1} radius={[4,4,0,0]} maxBarSize={36}/>
      </BarChart>:
      <LineChart data={data} margin={{left:0,right:12,top:8,bottom:0}}>
        <CartesianGrid vertical={false} stroke="var(--grid)"/>
        <XAxis dataKey="label" tickLine={false} axisLine={false} interval="preserveStartEnd" minTickGap={8}/>
        <YAxis tickLine={false} axisLine={false} width={40} domain={[lo,hi]} ticks={pctTicks} tickFormatter={v=>v+'%'}/>
        <Tooltip {...TT} cursor={{stroke:'var(--line)'}} formatter={(v,name)=>[v+'%',name]}/>
        <Line dataKey="rate" name={t('resolvedL')} stroke="var(--t1)" strokeWidth={2} dot={{r:3,fill:'var(--t1)',stroke:'var(--card)',strokeWidth:2}} activeDot={{r:5}} connectNulls/>
        <Line dataKey="fcrRate" name={t('fcrL')} stroke="var(--t3)" strokeWidth={2} dot={{r:3,fill:'var(--t3)',stroke:'var(--card)',strokeWidth:2}} activeDot={{r:5}} connectNulls/>
      </LineChart>}
    </ResponsiveContainer></Chart>

/* ---------------- AGENT: MY PERFORMANCE ---------------- */
function agentStats(rows){
  const n=rows.length, cs=rows.filter(r=>r.csat>0), ci=rows.filter(r=>r.cancel===1);
  return {n, csat:cs.length?cs.reduce((a,r)=>a+r.csat,0)/cs.length:null, csatN:cs.length,
    fcr:pct(rows.filter(r=>r.res&&!r.rep).length,n), cancel:ci.length, offer:ci.filter(r=>r.offer===1).length,
    offerP:ci.length?pct(ci.filter(r=>r.offer===1).length,ci.length):null, aht:n?rows.reduce((a,r)=>a+r.dur,0)/n:0};
}
function PerfTile({icon,label,value,team,diff,goodUp,neutral,note}){
  const {t}=useT();
  const tone=neutral||diff==null||Math.abs(diff)<0.5?'text-muted':(diff>0)===goodUp?'text-good':'text-bad';
  const word=neutral||diff==null||Math.abs(diff)<0.5?t('pfSame'):(diff>0)===goodUp?t('pfBetter'):t('pfWorse');
  return <div className="bg-card border border-line rounded-xl p-4 min-w-0">
    <div className="flex items-center justify-between"><span className="lbl">{label}</span><span className="text-faint"><Ic n={icon} size={16}/></span></div>
    <div className="mt-1.5 text-[28px] leading-none font-semibold tnum"><span dir="ltr" style={{unicodeBidi:'isolate'}}>{value}</span></div>
    <div className="mt-2 text-xs text-muted">{t('pfTeamAvg')} <LtrNum className="font-medium text-ink">{team}</LtrNum>{!neutral&&<span className={`ms-1.5 font-semibold ${tone}`}>· {word}</span>}</div>
    {note&&<div className="mt-1 text-[11px] text-faint leading-snug">{note}</div>}
  </div>;
}
function MyPerformance({user,coach}){
  const {t,lang}=useT();
  const mine=useMemo(()=>ROWS.filter(r=>r.agent===user.id),[user.id]);
  const team=useMemo(()=>ROWS.filter(r=>r.team===user.team),[user.team]);
  const m=agentStats(mine), tm=agentStats(team);
  // weekly "resolved without a repeat call": me vs team
  const weeks=useMemo(()=>{const map=new Map();
    const add=(r,key)=>{const d=rowDay(r);const k=addDays(d,-new Date(d+'T00:00:00Z').getUTCDay());const b=map.get(k)||{k,mn:0,mf:0,tn:0,tf:0};b[key+'n']++;if(r.res&&!r.rep)b[key+'f']++;map.set(k,b)};
    mine.forEach(r=>add(r,'m')); team.forEach(r=>add(r,'t'));
    return [...map.values()].sort((a,b)=>a.k.localeCompare(b.k)).map(b=>{const e0=addDays(b.k,6);const s=b.k<DATA_START?DATA_START:b.k,e=e0>DATA_END?DATA_END:e0;
      return {label:`${dm(s)}–${dm(e)}`,me:b.mn>=5?+f1(pct(b.mf,b.mn)):null,team:+f1(pct(b.tf,b.tn))}});
  },[mine,team]);
  // personal co-pilot tips: biggest gaps first
  const tips=[];
  if(m.offerP!=null&&tm.offerP!=null&&m.offerP<tm.offerP-10) tips.push(t('tipOffer',m.cancel-m.offer,m.cancel));
  if(m.fcr<tm.fcr-5) tips.push(t('tipFcr',Math.round(pct(tm.aht-m.aht,tm.aht))));
  if(m.csat!=null&&tm.csat!=null&&m.csat<tm.csat-0.3) tips.push(t('tipCsat'));
  if(!tips.length) tips.push(t('tipGood'));
  const vals=weeks.flatMap(w=>[w.me,w.team]).filter(v=>v!=null);
  const lo=vals.length?Math.max(0,Math.floor(Math.min(...vals)/10)*10-10):0, hi=vals.length?Math.min(100,Math.ceil(Math.max(...vals)/10)*10+10):100;
  const ticks=[];for(let v=lo;v<=hi;v+=10)ticks.push(v);
  return <div className="space-y-4">
    <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
      <h1 className="text-xl font-semibold">{coach?t('perfOf',user.name[lang]):t('myPerf')}</h1>
      <span className="text-sm text-muted">{t('pfSub',fmtN(m.n),user.team)}</span>
    </div>
    <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
      <PerfTile icon="Star" label={t('kCsat')} value={m.csat!=null?m.csat.toFixed(2):'—'} team={tm.csat!=null?tm.csat.toFixed(2):'—'} diff={m.csat!=null?(m.csat-tm.csat)*10:null} goodUp note={t('pfCsatNote',m.csatN)}/>
      <PerfTile icon="CircleCheck" label={t('pfFcr')} value={f1(m.fcr)+'%'} team={f1(tm.fcr)+'%'} diff={m.fcr-tm.fcr} goodUp note={t('pfFcrNote')}/>
      <PerfTile icon="HeartHandshake" label={t('pfOffer')} value={m.offerP!=null?f1(m.offerP)+'%':'—'} team={tm.offerP!=null?f1(tm.offerP)+'%':'—'} diff={m.offerP!=null?m.offerP-tm.offerP:null} goodUp note={m.cancel?t('pfOfferNote',m.offer,m.cancel):t('pfNoCancel')}/>
      <PerfTile icon="Timer" label={t('pfAht')} value={fmtT(m.aht)} team={fmtT(tm.aht)} neutral note={t('pfAhtNote')}/>
    </div>
    <div className="grid gap-4 xl:grid-cols-[minmax(0,1fr)_380px] items-start">
      <Card title={t('pfTrend')} icon="TrendingUp">
        <div className="flex flex-wrap gap-4 text-xs text-muted mb-1"><Swatch c="var(--t1)">{coach?user.name[lang]:t('pfMe')}</Swatch><Swatch c="var(--base)">{t('pfTeam',user.team)}</Swatch></div>
        <Chart h={240}><ResponsiveContainer><LineChart data={weeks} margin={{left:0,right:12,top:8,bottom:0}}>
          <CartesianGrid vertical={false} stroke="var(--grid)"/>
          <XAxis dataKey="label" tickLine={false} axisLine={false} interval={0}/>
          <YAxis tickLine={false} axisLine={false} width={40} domain={[lo,hi]} ticks={ticks} tickFormatter={v=>v+'%'}/>
          <Tooltip {...TT} cursor={{stroke:'var(--line)'}} formatter={(v,name)=>[v+'%',name]}/>
          <Line dataKey="team" name={t('pfTeam',user.team)} stroke="var(--base)" strokeWidth={2} strokeDasharray="5 4" dot={false}/>
          <Line dataKey="me" name={coach?user.name[lang]:t('pfMe')} stroke="var(--t1)" strokeWidth={2.5} dot={{r:3.5,fill:'var(--t1)',stroke:'var(--card)',strokeWidth:2}} activeDot={{r:5}} connectNulls/>
        </LineChart></ResponsiveContainer></Chart>
        <p className="text-xs text-faint mt-1">{t('pfTrendNote')}</p>
      </Card>
      <Card title={t('copilot')} icon="Bot">
        <Action>{tips.length>1?<ul className="space-y-1.5 list-disc ps-4">{tips.slice(0,2).map((x,i)=><li key={i}>{x}</li>)}</ul>:tips[0]}</Action>
        <p className="text-xs text-faint mt-3">{coach?t('coachTipNote'):t('pfPrivacy')}</p>
      </Card>
    </div>
  </div>;
}

/* one merged history list: call-log calls + CRM interactions + logs saved in the store */
function CustHistory({custId,currentId,crm}){
  const {t,he,queue,topic}=useT(); const {logs}=useContext(LogCtx);
  const calls=CUST_CALLS[custId]||[]; const ints=crm?.last_interactions||[]; const used=new Set();
  const saved=logs.filter(l=>l.cust===custId);
  const items=calls.map(r=>{const day='2026-'+r.time.slice(0,5);const sl=saved.find(l=>l.call_id===r.id);
    const iv=ints.findIndex((h,i)=>!used.has(i)&&h.date===day&&h.agent_id===r.agent);if(iv>=0)used.add(iv);
    return {k:'c'+r.id,sort:r.time,call:r,note:sl?{...sl,agent_id:sl.agent}:(iv>=0?ints[iv]:null),fresh:!!sl}});
  ints.forEach((h,i)=>{if(!used.has(i)) items.push({k:'i'+i,sort:h.date.slice(5),note:h})});
  saved.filter(l=>!calls.some(r=>r.id===l.call_id)).forEach(l=>items.push({k:'s'+l.id,sort:l.time,note:{...l,agent_id:l.agent},fresh:true,newCall:true}));
  items.sort((a,b)=>b.sort.localeCompare(a.sort));
  return <Card title={t('custHistory')} icon="History" bodyClass="p-0" right={<Badge tone="info" icon={false}>{items.length}</Badge>}>
    <div className="max-h-[440px] overflow-y-auto scroll-thin">
      {items.length?items.map(it=>{const r=it.call,h=it.note;const cur=r&&r.id===currentId;
        const sum=h?(he&&CRM_SUM_HE[h.summary]||h.summary||''):''; const rtl=h&&(it.fresh||sum!==h.summary); const bad=h&&/24h/i.test(h.summary||'');
        return <div key={it.k} className={`px-4 py-2.5 border-t border-line first:border-0 text-sm ${cur?'bg-accentsoft':''}`}>
          <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-muted">
            <LtrNum>{r?r.time:(h.time||h.date)}</LtrNum><span>· {r?r.agent:h.agent_id}</span>{r&&<span>· {queue(r.queue)}</span>}
            {cur&&<Badge tone="nba" icon={false}>{t('thisCall')}</Badge>}{it.newCall&&<Badge tone="nba" icon="PhoneIncoming">{t('newCall')}</Badge>}{it.fresh&&<Badge tone="pass" icon="Check">{t('loggedBadge')}</Badge>}
          </div>
          {r?<div className="mt-1 flex flex-wrap items-center gap-1.5"><span className="font-medium me-1">{JOBS[r.id]?pick(he,AI[r.id],'label'):topic(r.topic)}</span>
              <Badge tone={r.res?'pass':'warning'} icon={false}>{r.res?t('resolvedS'):t('unresolved')}</Badge>
              {r.tr===1&&<Badge tone="warning" icon="ArrowLeftRight">{t('transferred')}</Badge>}
              {r.cancel===1&&<Badge tone="violation" icon={false}>{t('cancelIntent')}</Badge>}
              {JOBS[r.id]&&<Badge tone="info" icon="AudioLines">{t('hasTx')}</Badge>}</div>
            :<div className="mt-1 text-xs"><Reason code={h.reason_code}/></div>}
          {sum&&<div className={`mt-1 text-[13px] text-ink whitespace-pre-line ${rtl?'he':''}`} dir={rtl?'rtl':'ltr'} style={{textAlign:'start'}}>{sum.length>200?sum.slice(0,200)+'…':sum}</div>}
          {bad&&<div className="mt-1.5"><Badge tone="violation">{t('badLog')}</Badge></div>}
        </div>}):<div className="p-6 text-sm text-faint text-center">{t('noRecent')}</div>}
    </div>
  </Card>;
}

/* ---------------- APP ---------------- */
function LangSwitch({lang,setLang}){
  return <div className="flex items-center gap-1.5" role="radiogroup" aria-label={STR[lang].lang}>
    <Ic n="Languages" size={16} className="text-navmuted"/>
    <div className="flex rounded-lg p-0.5" style={{background:'rgba(255,255,255,.08)'}}>
      {[['en','EN','English'],['he','עב','עברית']].map(([k,l,full])=><button key={k} role="radio" aria-checked={lang===k} title={full} onClick={()=>setLang(k)} className={`rounded-md px-2.5 py-1.5 text-[13px] font-semibold transition ${lang===k?'bg-card text-ink':'hover:text-white'}`} style={lang===k?{}:{color:'var(--navmuted)'}}>{l}</button>)}
    </div>
  </div>;
}

function Login({onLogin}){
  const {t,lang}=useT();
  const [v,setV]=useState(''); const [err,setErr]=useState('');
  const go=x=>{if(!resolveUser(x)){setErr(t('loginErr'));return} onLogin(String(x).trim())};
  const demos=[['1','UserRound',`${AGENT_NAMES.A17[lang]} · ${t('roleAgent')} · A17`],['2','LayoutDashboard',`${MANAGER.name[lang]} · ${t('roleManager')}`],['A23','UserRound',`${AGENT_NAMES.A23[lang]} · ${t('roleAgentF')} · A23`]];
  return <div className="max-w-[440px] mx-auto pt-6 sm:pt-14">
    <div className="text-center mb-5">
      <div className="w-12 h-12 mx-auto rounded-xl grid place-items-center" style={{background:'var(--accent)'}}><Ic n="Headset" size={24} className="text-white"/></div>
      <h1 className="mt-3 text-xl font-semibold">{t('loginTitle')}</h1>
      <div className="text-sm text-muted">{t('appSub')}</div>
    </div>
    <Card title={t('loginBtn')} icon="LogIn">
      <form onSubmit={e=>{e.preventDefault();go(v)}}>
        <label htmlFor="uid" className="lbl">{t('loginLabel')}</label>
        <input id="uid" autoFocus autoComplete="off" spellCheck={false} dir="ltr" value={v} onChange={e=>{setV(e.target.value);setErr('')}} placeholder="1 · 2 · A17"
          className="mono mt-1.5 w-full rounded-lg border border-line bg-sunken px-3 py-2.5 text-[15px] text-ink focus:outline-none focus:border-[var(--accent)]" style={{textAlign:lang==='he'?'right':'left'}}/>
        {err&&<div role="alert" className="mt-2 text-xs text-bad flex items-center gap-1.5"><Ic n="CircleAlert" size={13}/>{err}</div>}
        <button type="submit" className="mt-3 w-full rounded-lg bg-accent text-white py-2.5 text-sm font-semibold inline-flex items-center justify-center gap-2 hover:opacity-90"><Ic n="LogIn" size={16} className="rtl:-scale-x-100"/>{t('loginBtn')}</button>
      </form>
      <div className="lbl mt-5 mb-1.5">{t('demoUsers')}</div>
      <div className="space-y-1.5">
        {demos.map(([id,ic,l])=><button key={id} onClick={()=>go(id)} className="w-full flex items-center gap-3 rounded-lg border border-line px-3 py-2 text-sm hover:bg-sunken text-start">
          <span className="mono w-9 shrink-0 rounded bg-sunken text-center py-0.5 text-xs font-semibold">{id}</span><Ic n={ic} size={15} className="text-muted"/><span className="truncate">{l}</span></button>)}
        <div className="text-xs text-muted px-1 pt-0.5">{t('anyAgent')}</div>
      </div>
      <div className="mt-4 text-[11px] text-faint">{t('loginNote')}</div>
    </Card>
  </div>;
}

const tabsFor=(u,s)=>u.role==='manager'?[['manager','LayoutDashboard',s.managerTab,s.managerShort],['teams','Users',s.teamsTab,s.teamsTab],['agent','ClipboardCheck',s.reviewTab,s.reviewShort]]
  :[['agent','Headphones',s.callTab,s.callTab],['me','TrendingUp',s.myPerf,s.myPerfShort]];
function App(){
  const [lang,setLang]=useState(()=>{try{return localStorage.getItem('netcom-lang')==='he'?'he':'en'}catch(e){return 'en'}});
  const [uid,setUid]=useState(()=>{try{return sessionStorage.getItem('netcom-user')||''}catch(e){return ''}});
  const user=resolveUser(uid);
  const [mode,setMode]=useState(()=>location.hash?location.hash.slice(1):null); // no hash → the role's default tab
  const [callId,setCallId]=useState('203743');
  const [toast,setToast]=useState(null);
  const store=useLogStore(); const [openReq,setOpenReq]=useState(null);
  const [procsSeen,setProcsSeen]=useState(()=>{try{return sessionStorage.getItem('netcom-procs-seen')==='1'}catch(e){return false}});
  const markProcsSeen=()=>{setProcsSeen(true);try{sessionStorage.setItem('netcom-procs-seen','1')}catch(e){}};
  const storeRef=useRef(store); storeRef.current=store;
  const api=useMemo(()=>createApi({persist:rec=>storeRef.current.add(rec)}),[]);
  const go=m=>{setMode(m);try{history.replaceState(null,'','#'+m)}catch(e){}};
  const changeLang=l=>{setLang(l);try{localStorage.setItem('netcom-lang',l)}catch(e){}};
  const login=id=>{const u=resolveUser(id);setUid(id);setProcsSeen(false);try{sessionStorage.setItem('netcom-user',id);sessionStorage.removeItem('netcom-procs-seen')}catch(e){}
    if(u.role==='manager') go('manager'); else {const own=CALL_IDS.find(c=>ROW_BY_ID[c].agent===u.id);setCallId(own||'203743');go('agent')}};
  const logout=()=>{setUid('');setToast(null);try{sessionStorage.removeItem('netcom-user');history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
  useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr'},[lang]);
  const s=STR[lang];
  const allowed=user?tabsFor(user,s).map(x=>x[0]):[];
  const view=allowed.includes(mode)?mode:(user?.role==='manager'?'manager':'agent');
  const openCall=row=>{if(!row)return;setOpenReq({row,n:Date.now()});go('agent');window.scrollTo(0,0)};
  const role=user?(user.role==='manager'?s.roleManager:(user.f?s.roleAgentF:s.roleAgent)):'';
  return <LangCtx.Provider value={lang}><LogCtx.Provider value={store}><ApiCtx.Provider value={api}><div className="min-h-screen" dir={lang==='he'?'rtl':'ltr'} lang={lang}>
    <nav className="sticky z-40 bg-nav text-navink gutter" style={{top:'env(safe-area-inset-top,0px)'}}>
      <div className="max-w-[1500px] mx-auto flex flex-wrap items-center gap-x-3 gap-y-2 py-2.5">
        <div className="flex items-center gap-2.5 me-auto">
          <div className="w-8 h-8 rounded-lg grid place-items-center" style={{background:'var(--accent)'}}><Ic n="Headset" size={17} className="text-white"/></div>
          <div className="leading-tight"><div className="text-[15px] font-semibold">Netcom Service Co-Pilot</div><div className="text-[11px]" style={{color:'var(--navmuted)'}}>{s.appSub}</div></div>
        </div>
        {user&&<div className="flex rounded-lg p-0.5" style={{background:'rgba(255,255,255,.08)'}} role="tablist">
          {tabsFor(user,s).map(([k,ic,l,sh])=>
            <button key={k} role="tab" aria-selected={view===k} onClick={()=>go(k)} className={`inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-[13px] font-semibold transition ${view===k?'bg-card text-ink':'hover:text-white'}`} style={view===k?{}:{color:'var(--navmuted)'}}><Ic n={ic} size={15}/><span className="hidden sm:inline">{l}</span><span className="sm:hidden">{sh}</span></button>)}
        </div>}
        {user&&<ProcsButton nav highlight={user.role==='agent'&&!procsSeen} onOpen={markProcsSeen}/>}
        {user&&<div className="flex items-center gap-2 min-w-0">
          <div className="w-8 h-8 shrink-0 rounded-full grid place-items-center text-[13px] font-semibold" style={{background:'rgba(255,255,255,.12)'}}>{user.name[lang].slice(0,1)}</div>
          <div className="leading-tight min-w-0">
            <div className="text-[13px] font-semibold truncate">{s.hello(user.name[lang])}</div>
            <div className="text-[11px] truncate" style={{color:'var(--navmuted)'}}>{role}{user.role==='agent'&&<> · <span className="mono">{user.id}</span> · {s.team} {user.team}</>}</div>
          </div>
          <button onClick={logout} title={s.logout} className="ms-1 inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-[12px] font-semibold hover:text-white" style={{color:'var(--navmuted)',background:'rgba(255,255,255,.06)'}}><Ic n="LogOut" size={14} className="rtl:-scale-x-100"/><span className="hidden sm:inline">{s.logout}</span></button>
        </div>}
        <LangSwitch lang={lang} setLang={changeLang}/>
      </div>
    </nav>
    <main className="gutter py-5"><div className="max-w-[1500px] mx-auto">
      {!user?<Login onLogin={login}/>:<>
          {view==='manager'&&<Manager openCall={id=>openCall(ROW_BY_ID[id])}/>}
          {(view==='team'||view==='teams')&&<TeamView key={view} user={user} onOpenCall={openCall}/>}
          {/* the workspace stays mounted so a live call survives switching tabs */}
          <div hidden={view!=='agent'}><AgentWorkspace key={user.id} user={user} callId={callId} setCallId={setCallId} toast={setToast} openReq={openReq}/></div>
          {view==='me'&&<MyPerformance user={user}/>}</>}
      <footer className="mt-6 text-[11px] text-faint">{s.footer}</footer>
    </div></main>
    <Toast toast={toast} onClose={()=>setToast(null)}/>
  </div></ApiCtx.Provider></LogCtx.Provider></LangCtx.Provider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
